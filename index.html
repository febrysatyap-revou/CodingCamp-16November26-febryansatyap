<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <header class="card header-card">
      <div class="top-controls">
        <button id="theme-toggle-btn" class="btn-outline">🌙 Dark</button>
      </div>
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">Loading date...</div>
      <h1 id="greeting" class="greeting">Good Morning</h1>
    </header>

    <!-- MAIN GRID -->
    <main class="dashboard-grid">
      <!-- FOCUS TIMER -->
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div id="timer-display" class="timer-display">25:00</div>
        <div class="timer-buttons">
          <button id="start-btn" class="btn btn-primary">Start</button>
          <button id="stop-btn" class="btn btn-secondary">Stop</button>
          <button id="reset-btn" class="btn btn-secondary">Reset</button>
        </div>
      </section>

      <!-- TASKS (TO-DO LIST) -->
      <section class="card tasks-card">
        <div class="tasks-header">
          <h2>Tasks</h2>
          <button id="sort-tasks-btn" class="btn-outline" title="Sort tasks">⇅ Sort</button>
        </div>
        <form id="task-form" class="input-group">
          <input type="text" id="task-input" placeholder="Add a new task..." required />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <p id="task-warning" class="warning-text"></p>
        <ul id="task-list" class="task-list"></ul>
      </section>

      <!-- QUICK LINKS -->
      <section class="card links-card">
        <h2>Quick Links</h2>
        <form id="link-form" class="link-input-group">
          <input type="text" id="link-name" placeholder="Link name" required />
          <input type="url" id="link-url" placeholder="URL (https://...)" required />
          <button type="submit" class="btn btn-primary">Add Link</button>
        </form>
        <div id="links-container" class="links-container"></div>
      </section>
    </main>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
